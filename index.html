<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Naksh</title>
  <meta name="description" content="Many faces. Many dimensions.">
  <link rel="preload" href="assets/intro.mp4" as="video" type="video/mp4">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The black galaxy. Fixed behind everything; revealed once the camera passes through the eye. -->
  <canvas id="galaxy" class="galaxy" aria-hidden="true"></canvas>

  <main>
    <!--
      PART A — THE THRESHOLD
      A tall scroll track with a sticky, full-viewport stage. Scroll progress through the track
      drives the camera into the eye, so the journey can be taken automatically, scrubbed by hand,
      or reversed to come back out.
    -->
    <section id="threshold" class="threshold" aria-label="Opening">
      <div class="stage">
        <div class="world">
          <!-- Mirrored, blurred continuation of the footage that fills wide screens without stretching it -->
          <canvas class="extend" aria-hidden="true"></canvas>
          <div class="frame">
            <video id="intro" class="intro" muted playsinline autoplay preload="auto"
                   poster="assets/intro-poster.jpg" disablepictureinpicture disableremoteplayback
                   aria-hidden="true" tabindex="-1">
              <source src="assets/intro.webm" type="video/webm">
              <source src="assets/intro.mp4" type="video/mp4">
            </video>
            <!-- Holds the last frame while the loop restarts, so the faces dissolve instead of cutting -->
            <canvas class="crossfade" aria-hidden="true"></canvas>
          </div>
        </div>

        <div class="glint" aria-hidden="true"></div>
        <div class="pupil" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <p class="whisper" aria-live="polite">
          <span class="whisper__line whisper__line--linger" data-touch="tap to linger" data-fine="click to linger">tap to linger</span>
          <span class="whisper__line whisper__line--enter">scroll to enter</span>
        </p>
        <div class="countdown" aria-hidden="true"><span></span></div>
      </div>
    </section>

    <!--
      THE FIRST DIMENSION — directly below the threshold, on the same page.
      Intentionally empty: content for this side of the portfolio goes inside .dimension__inner.
      Add further <section class="dimension"> blocks after it; the galaxy stays behind all of them.
    -->
    <section id="dimension-1" class="dimension" aria-label="First dimension">
      <div class="dimension__inner"></div>
    </section>
  </main>

  <noscript>
    <style>.threshold{height:100vh}.stage{position:relative}.extend,.whisper,.countdown{display:none}.intro{object-fit:cover}</style>
  </noscript>

  <script src="main.js" defer></script>
</body>
</html>
